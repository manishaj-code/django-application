# Reproducible stack: PostgreSQL + Django/Gunicorn + nginx.
#
#   cp .env.docker.example .env.docker      # then edit the values
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker exec web python manage.py createsuperuser
#
# The site is then on http://localhost:${HTTP_PORT:-8080}/

name: django-cms

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env.docker}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env.docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Only nginx can reach this container, so trust its forwarded headers.
      FORWARDED_ALLOW_IPS: "*"
      USE_X_FORWARDED_PROTO: "True"
      NUM_PROXIES: "1"
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Uses the first ALLOWED_HOSTS entry as Host header so Django accepts it.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip();
          req = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host});
          urllib.request.urlopen(req, timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media:
