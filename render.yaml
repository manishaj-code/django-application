# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → select this repository → fill in the values
# marked "sync: false" → Apply.
#
# Configured for Render's FREE plan (demo/testing):
#   * the web service sleeps after 15 minutes without traffic (~1 min wake-up);
#   * the free database expires 30 days after creation (14-day grace to upgrade);
#   * uploaded images are stored on the container's disk and are lost on every
#     redeploy/restart (free services can't attach a persistent disk).
# To go to production, change both plans and add a disk (see docs/DEPLOYMENT.md).

services:
  - type: web
    name: django-cms
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-cms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SITE_NAME
        value: Django CMS
      # Render's proxy terminates HTTPS and sets X-Forwarded-Proto.
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: NUM_PROXIES
        value: "0"
      # No SMTP yet: emails (password reset links) are written to the service
      # logs, visible only in your Render dashboard. Replace with SMTP settings
      # (EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend, EMAIL_HOST,
      # EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL) for real use.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: SERVE_MEDIA
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      # First admin account, created on start-up if it doesn't exist.
      # You are asked for these when applying the Blueprint.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: django-cms-db
    plan: free
    region: singapore
    databaseName: django_cms
    user: django_cms_user
