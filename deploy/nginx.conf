# Reverse proxy for the Django app (used by compose.yaml).
# Serves uploaded media directly; everything else goes to Gunicorn.
# For HTTPS, terminate TLS here (certbot) or in a proxy/load balancer in
# front of this container; see docs/DEPLOYMENT.md.

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Slightly above MAX_UPLOAD_SIZE_MB so Django can show a friendly error.
    client_max_body_size 10m;

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        # Uploaded files are never allowed to run scripts.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # If another proxy terminates TLS in front of this one, replace
        # $scheme with $http_x_forwarded_proto.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
