{% load core_tags %}
{% if field.is_hidden %}
  {{ field }}
{% elif field|is_checkbox %}
  <div class="mb-3 form-check">
    {{ field|bs_widget }}
    <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% include "partials/_field_feedback.html" %}
  </div>
{% else %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field|bs_widget }}
    {% include "partials/_field_feedback.html" %}
  </div>
{% endif %}
