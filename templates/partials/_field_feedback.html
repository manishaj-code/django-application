{% if field.errors %}
  <div class="invalid-feedback d-block" id="{{ field.auto_id }}_error">
    {% for error in field.errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
  </div>
{% endif %}
{% if field.help_text %}
  <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>
{% endif %}
